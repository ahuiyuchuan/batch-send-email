[package]
name = "member-core"
version = "1.0.1"
edition = "2021"
authors = ["ahui"]
license = "GPL-3.0-only"
repository = "https://github.com/ahuiyuchuan/batch-send-email"
description = "QQ web member reading, verification, and safe local export"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cookie_store = { version = "0.22", default-features = false, features = ["serde"] }
csv = "1.3"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ammonia = "4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls", "hostname"] }
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies"] }
rust_xlsxwriter = "0.90"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
url = "2"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
zip = "4"

