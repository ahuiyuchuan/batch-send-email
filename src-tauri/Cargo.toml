[package]
name = "batch-send-email"
version = "1.0.1"
description = "QQ group member management and multi-account email desktop tool"
authors = ["ahui"]
license = "GPL-3.0-only"
repository = "https://github.com/ahuiyuchuan/batch-send-email"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
member-core = { path = "../crates/member-core" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

# 关于页只读GitHub正式发布元数据；不复用成员读取客户端或任何Cookie/SMTP凭据。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semver = "1"
url = "2"

[dev-dependencies]
# 用虚拟时钟验证每小时检查及失败节流，不在测试里联网或真实等待一小时。
tokio = { version = "1", features = ["test-util"] }

